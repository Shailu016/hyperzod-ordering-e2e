# Scheduled E2E runs (free tier friendly).
#
# WHAT: runs this suite automatically at fixed intervals against
# https://automations-store.hyperzod.me/ (or BASE_URL override).
# WHY GITHUB ACTIONS: public repos get unlimited free minutes; private repos
# get 2,000 min/month. Bitbucket's free tier is only ~50 min/month, and one
# full matrix here costs ~35 min - so GitHub scheduling is the free answer.
# (Bitbucket alternative: repo Settings -> Pipelines -> Schedules on the
# custom e2e-web / e2e-mobile pipelines - same suite, paid minutes.)
#
# SAFETY: `concurrency` below guarantees runs never overlap. Overlapping runs
# share one TEST_USER_EMAIL/cart and will clobber each other's sessions.
# Do NOT add a matrix that runs projects in parallel.

name: scheduled-e2e-full

on:
  schedule:
    # Full matrix 1x daily: 6:00 PM IST = 12:30 UTC.
    # (5 AM / 1 PM / 1 AM IST run smoke via scheduled-e2e-smoke.yml.)
    - cron: "30 12 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: "Which suite to run"
        required: true
        default: "all"
        type: choice
        options: [smoke, web, android, ios, mobile, all]
      base_url:
        description: "Store under test (default: suite default)"
        required: false
        default: ""
        type: string

concurrency:
  # One group across BOTH workflow files: smoke and full runs share one
  # test user/cart and must never overlap, however they were triggered.
  group: ordering-e2e-suite
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.48.2-jammy
    timeout-minutes: 90
    env:
      BASE_URL: ${{ inputs.base_url || secrets.E2E_BASE_URL }}
      TEST_USER_FIRST_NAME: ${{ secrets.E2E_USER_FIRST_NAME }}
      TEST_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      TEST_USER_PHONE: ${{ secrets.E2E_USER_PHONE }}
      TEST_USER_COUNTRY: ${{ secrets.E2E_USER_COUNTRY }}
      TEST_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      TEST_LOCATION_QUERY: ${{ secrets.E2E_LOCATION_QUERY }}
      TEST_FALLBACK_OTP: ${{ secrets.E2E_FALLBACK_OTP }}
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate E2E configuration
        run: npm run check:env

      - name: Lint (syntax + module load)
        run: npm run lint

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Resolve suite (schedule always runs full; manual picks)
        id: suite
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "name=all" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ inputs.suite }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run E2E suite
        run: |
          case "${{ steps.suite.outputs.name }}" in
            smoke)   npm run test:smoke ;;
            web)     npm run test:web ;;
            android) npm run test:android ;;
            ios)     npm run test:ios ;;
            mobile)  npm run test:mobile ;;
            all)     npm run test:web && npm run test:android && npm run test:ios ;;
          esac

      - name: Upload evidence (report + traces + videos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ github.run_number }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14

      - name: Notify Slack with latest report
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          E2E_SUITE_LABEL: full matrix
        run: python3 scripts/notify-slack.py
