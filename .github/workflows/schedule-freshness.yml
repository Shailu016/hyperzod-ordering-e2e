name: schedule-freshness
on:
  schedule:
    - cron: '11,26,41,56 * * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: ordering-schedule-monitor
  cancel-in-progress: false
jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache/restore@v4
        with:
          path: .monitor/state.json
          key: ordering-monitor-${{ github.run_id }}
          restore-keys: ordering-monitor-
      - name: Inspect schedule freshness without starting tests
        id: freshness
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-schedule.js
      # Slack incident notifications are unwired for now, and nothing acknowledges
      # in their place: pending incidents stay visible in the workflow outputs
      # until alerting is re-enabled, instead of being silently marked known.
      - uses: actions/cache/save@v4
        if: success()
        with:
          path: .monitor/state.json
          key: ordering-monitor-${{ github.run_id }}
