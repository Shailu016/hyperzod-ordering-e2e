# Full web/Android/iOS suite at 1 AM, 3 AM, 5 AM and 1 PM IST.
# The legacy workflow name/path and slot ownership remain stable so previously
# completed smoke slots and delayed native triggers cannot execute twice.
# The other eight odd-hour slots are in scheduled-e2e.yml. All use the shared account queue.

name: scheduled-e2e-smoke

run-name: >-
  ${{ inputs.schedule_slot && format('Ordering full · slot {0}', inputs.schedule_slot) ||
      (github.event_name == 'schedule' && format('Ordering full · native {0}', github.event.schedule) || format('Ordering {0} · manual', inputs.suite == 'all' && 'full' || inputs.suite)) }}

env:
  E2E_SCHEDULE_PROTOCOL: slots-v1

on:
  schedule:
    - cron: "30 23 * * *"
    - cron: "30 7 * * *"
    - cron: "30 19 * * *"
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: "Which suite to run"
        required: true
        default: "all"
        type: choice
        options: [smoke, web, android, ios, mobile, all]
      schedule_slot:
        description: "Scheduler slot (UTC ISO; leave empty for a manual run)"
        required: false
        default: ""
        type: string
      base_url:
        description: "Store under test (default: suite default)"
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: write # Atomic identity lease refs; no administration or secret permissions.

jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      admitted: ${{ steps.claim.outputs.admitted }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Admit one execution per scheduled slot
        id: claim
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          E2E_SCHEDULE_ENABLED_AT: ${{ vars.E2E_SCHEDULE_ENABLED_AT }}
          E2E_SCHEDULE_KIND: smoke
        run: node scripts/admit-schedule.js
      - name: Preserve execution admission receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schedule-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: .schedule/admission.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  e2e:
    needs: admission
    if: needs.admission.outputs.admitted == 'true'
    concurrency:
      group: ordering-e2e-suite
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 90
    env:
      BASE_URL: ${{ inputs.base_url || secrets.E2E_BASE_URL }}
      TEST_USER_FIRST_NAME: ${{ secrets.E2E_USER_FIRST_NAME }}
      TEST_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      TEST_USER_PHONE: ${{ secrets.E2E_USER_PHONE }}
      TEST_USER_COUNTRY: ${{ secrets.E2E_USER_COUNTRY }}
      TEST_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      TEST_LOCATION_QUERY: ${{ secrets.E2E_LOCATION_QUERY }}
      TEST_FALLBACK_OTP: ${{ secrets.E2E_FALLBACK_OTP }}
      REPORT_DELIVERY: pages-v1
      CI: "true"
      E2E_LEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate E2E configuration
        run: npm run check:env

      - name: Lint (syntax + module load)
        run: npm run lint

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Resolve suite (scheduled slots always run all devices)
        id: suite
        env:
          E2E_SCHEDULE_KIND: smoke
          E2E_SCHEDULE_SLOT: ${{ inputs.schedule_slot }}
          E2E_REQUESTED_SUITE: ${{ inputs.suite }}
        run: node scripts/resolve-scheduled-suite.js

      - name: Run E2E suite
        env:
          E2E_SUITE: ${{ steps.suite.outputs.name }}
        run: node scripts/run-suite.js "$E2E_SUITE"

      - name: Select evidence retention
        if: always()
        id: retention
        env:
          E2E_JOB_STATUS: ${{ job.status }}
        shell: python3 {0}
        run: |
          import json, os
          from pathlib import Path
          try:
              summary = json.loads(Path('test-results/summary.json').read_text())
          except (OSError, ValueError):
              summary = {}
          owned = str(summary.get('runId', '')).startswith(os.environ['GITHUB_RUN_ID'] + '-')
          days = 3 if owned and summary.get('status') == 'passed' and os.environ['E2E_JOB_STATUS'] == 'success' else 14
          identity = {'id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'head_sha': os.environ['GITHUB_SHA']}
          Path('test-results').mkdir(exist_ok=True)
          Path('test-results/source.json').write_text(json.dumps(identity), encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'days={days}\n')

      - name: Upload evidence (report + traces + videos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: |
            test-results/
          retention-days: ${{ steps.retention.outputs.days || 14 }}
