name: publish-ordering-reports
on:
  workflow_run:
    workflows: [scheduled-e2e-smoke, scheduled-e2e-full]
    types: [completed]
  schedule:
    # Retention cleanup only. Never starts tests or sends Slack messages.
    - cron: '17 18 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: ordering-report-pages
  cancel-in-progress: false
  queue: max
jobs:
  publish:
    if: >-
      (github.event_name != 'workflow_run' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve trusted source run
        if: github.event_name == 'workflow_run'
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/report_source.py
      - name: Download source execution receipt
        if: steps.source.outputs.admission == 'slots-v1' && steps.source.outputs.delivery == 'pages-v1'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: schedule-admission-${{ steps.source.outputs.id }}-${{ steps.source.outputs.attempt }}
          path: .report-publication/admission
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.source.outputs.id }}
      - name: Verify execution or suppress duplicate slot
        id: admission
        if: always() && steps.source.outputs.admission == 'slots-v1' && steps.source.outputs.delivery == 'pages-v1'
        run: python scripts/report_admission.py --source .report-publication/source-run.json --receipt .report-publication/admission/admission.json
      - name: Download source evidence
        if: steps.source.outputs.delivery == 'pages-v1' && steps.admission.outputs.publish != 'false' && steps.admission.outputs.blocked != 'true'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ${{ steps.source.outputs.artifact }}
          path: .report-publication/incoming
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.source.outputs.id }}
      - name: Prepare public report bundle
        if: always() && steps.source.outputs.delivery == 'pages-v1' && steps.admission.outputs.publish != 'false' && steps.admission.outputs.blocked != 'true'
        id: prepare
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          E2E_AI_ANALYSIS_DISABLED: ${{ vars.E2E_AI_ANALYSIS_DISABLED }}
        run: python scripts/report_site.py prepare --input .report-publication/incoming --output .report-publication/prepared --source .report-publication/source-run.json
      - name: Retain generated report bundle outside Git
        id: retained
        if: steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ordering-report-${{ steps.prepare.outputs.run_key }}
          path: .report-publication/prepared/bundle/
          include-hidden-files: true
          retention-days: ${{ steps.prepare.outputs.retention_days }}
          if-no-files-found: error
          overwrite: true
      - name: Restore unexpired report history
        id: history
        if: github.event_name != 'workflow_run' || steps.prepare.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_RUN_KEY: ${{ steps.prepare.outputs.run_key }}
        run: python scripts/report_history.py --output .report-publication/retained --current-key "$CURRENT_RUN_KEY"
      - name: Assemble report site and remove expired evidence
        if: steps.history.outcome == 'success'
        run: |
          if [ -d .report-publication/prepared/bundle ]; then
            python scripts/report_site.py assemble --bundles .report-publication/prepared/bundle --history .report-publication/retained --output .report-publication/report-site
          else
            python scripts/report_site.py assemble --history .report-publication/retained --output .report-publication/report-site
          fi
      - name: Configure Pages
        if: steps.history.outcome == 'success'
        uses: actions/configure-pages@v5
      - name: Package generated site
        if: steps.history.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .report-publication/report-site
      - name: Publish report site
        if: steps.history.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify this run and attempt are live
        if: steps.prepare.outcome == 'success' && steps.deployment.outcome == 'success'
        id: verify
        timeout-minutes: 6
        env:
          REPORT_BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python scripts/verify_report.py --base-url "$REPORT_BASE_URL" --publication .report-publication/prepared/publication.json
      - name: Send one Slack outcome with verified evidence
        if: always() && steps.source.outputs.delivery == 'pages-v1' && steps.admission.outputs.publish != 'false'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          E2E_EXECUTION_BLOCKED: ${{ steps.admission.outputs.blocked }}
          E2E_REPORT_PUBLISHER: 'true'
          E2E_SOURCE_RUN_ID: ${{ steps.source.outputs.id }}
          E2E_SOURCE_RUN_NUMBER: ${{ steps.source.outputs.number }}
          E2E_SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.attempt }}
          E2E_SOURCE_SHA: ${{ steps.source.outputs.sha }}
          E2E_SOURCE_REF_NAME: main
          E2E_JOB_STATUS: ${{ steps.source.outputs.conclusion }}
          E2E_PUBLICATION_FILE: .report-publication/prepared/publication.json
          E2E_REPORT_BASE_URL: ${{ steps.deployment.outputs.page_url }}
          E2E_REPORT_PUBLISH_STATUS: ${{ steps.verify.outcome }}
          E2E_REPORT_DEPLOY_STATUS: ${{ steps.deployment.outcome }}
          E2E_REPORT_VERIFY_STATUS: ${{ steps.verify.outputs.status }}
          E2E_REPORT_ARTIFACT_STATUS: ${{ steps.retained.outcome }}
          E2E_REPORT_ARTIFACT_RUN_ID: ${{ github.run_id }}
        run: python scripts/notify-slack.py .report-publication/prepared/notification.json
